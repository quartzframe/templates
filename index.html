<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Grammar Tutor</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eef5ff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.app{width:min(960px,94vw);height:min(760px,92vh);display:flex;flex-direction:column;background:#0d1b2a;border:1px solid #20364d;border-radius:28px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.4)}
header{padding:22px 26px;background:linear-gradient(135deg,#102a43,#163d5c);border-bottom:1px solid #294862;display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:16px;background:#fff;color:#0d2940;display:grid;place-items:center;font-weight:900;font-size:22px} h1{margin:0;font-size:20px} .sub{color:#a9c4da;font-size:12px;margin-top:4px}
.chat{flex:1;overflow:auto;padding:26px;display:flex;flex-direction:column;gap:16px} .msg{max-width:78%;padding:14px 17px;border-radius:18px;line-height:1.55;white-space:pre-wrap} .bot{align-self:flex-start;background:#14283b;border:1px solid #23445e} .user{align-self:flex-end;background:#246b8f}
.welcome{text-align:center;color:#9fb8cb;margin:auto;max-width:520px} .welcome h2{color:#eef5ff} .inputbar{display:flex;gap:10px;padding:18px;border-top:1px solid #20364d;background:#0a1725} textarea{flex:1;resize:none;border:1px solid #29465e;background:#101f2e;color:#fff;border-radius:16px;padding:14px;font:inherit;outline:none;min-height:52px;max-height:120px} button{border:0;border-radius:16px;padding:0 22px;background:#eaf6ff;color:#0b2538;font-weight:800;cursor:pointer} button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">E</div><div><h1>English Grammar Tutor</h1><div class="sub">Focused English learning assistant</div></div></header>
<main class="chat" id="chat"><div class="welcome" id="welcome"><h2>Ready to learn English?</h2><p>Ask me an English-study question and let's practice together.</p></div></main>
<form class="inputbar" id="form"><textarea id="message" placeholder="Ask an English learning question..." rows="1"></textarea><button id="send" type="submit">Send</button></form>
</div>
<script>
const form=document.getElementById("form"), input=document.getElementById("message"), chat=document.getElementById("chat"), send=document.getElementById("send"), welcome=document.getElementById("welcome");
function add(text, cls){const el=document.createElement("div");el.className="msg "+cls;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;}
form.addEventListener("submit",async e=>{
 e.preventDefault(); const message=input.value.trim(); if(!message)return;
 if(welcome) welcome.remove(); add(message,"user"); input.value=""; send.disabled=true; add("Thinking…","bot");
 const loading=chat.lastElementChild;
 try{const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});const data=await r.json();loading.remove();add(data.reply||data.error||"Something went wrong.","bot");}
 catch{loading.remove();add("Connection error. Please try again.","bot");} finally{send.disabled=false;input.focus();}
});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
</script>
</body></html>
